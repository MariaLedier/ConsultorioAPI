<!DOCTYPE html>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Consultório Profissional</title>
		<style>
			* { box-sizing: border-box; margin: 0; padding: 0; }
			body { font-family: Arial, sans-serif; background: #f0f0f0; font-size: 15px; color: #222; }
			.tabs { display: flex; background: #2c5f8a; padding: 0 16px; }
			.tab { padding: 14px 20px; color: rgba(255,255,255,.65); cursor: pointer; border-bottom: 3px solid transparent; font-size: 14px; }
			.tab.active { color: #fff; border-bottom-color: #fff; }
			.page { display: none; padding: 24px; max-width: 860px; margin: 0 auto; }
			.page.active { display: block; }
			h2 { font-size: 18px; margin-bottom: 16px; color: #2c5f8a; }
			.form-box { background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 16px; margin-bottom: 20px; }
			.form-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
			.form-row label { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 140px; font-size: 13px; color: #555; }
			.form-row input, .form-row select { padding: 7px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
			.btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
			.btn-blue { background: #2c5f8a; color: #fff; }
			.btn-red { background: #c0392b; color: #fff; font-size: 12px; padding: 5px 10px; }
			.btn-gray { background: #888; color: #fff; font-size: 12px; padding: 5px 10px; }
			.btn-orange { background: #e67e22; color: #fff; font-size: 12px; padding: 5px 10px; }
			.table-box { background: #fff; border: 1px solid #ddd; border-radius: 6px; overflow: hidden; }
			table { width: 100%; border-collapse: collapse; }
			th { background: #2c5f8a; color: #fff; text-align: left; padding: 10px 12px; font-size: 13px; }
			td { padding: 9px 12px; border-bottom: 1px solid #eee; font-size: 14px; }
			.status { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
			.status-agendada  { background: #d4edda; color: #155724; }
			.status-cancelada { background: #f8d7da; color: #721c24; }
			#msg { position: fixed; bottom: 20px; right: 20px; padding: 12px 18px; border-radius: 5px; color: #fff; display: none; z-index: 99; }
			#msg.ok { background: #27ae60; }
			#msg.err { background: #c0392b; }
			.vazio { text-align: center; padding: 30px; color: #999; }
		</style>
	</head>
	<body>

		<div class="tabs">
			<div class="tab active" onclick="ir('medicos',this)">Medicos</div>
			<div class="tab" onclick="ir('pacientes',this)">Pacientes</div>
			<div class="tab" onclick="ir('consultas',this)">Consultas</div>
			<div class="tab" onclick="ir('agenda',this)">Agenda do Dia</div>
		</div>

		<!-- MEDICOS -->
		<div id="page-medicos" class="page active">
			<h2>Medicos</h2>
			<div class="form-box">
				<h3 id="titulo-med">Cadastrar Medico</h3>
				<input type="hidden" id="med-id" />
				<div class="form-row">
					<label>
						Nome <input id="med-nome" />
					</label>
					<label>
						CRM <input id="med-crm" placeholder="CRM-SP-1234" maxlength="13" />
					</label>
					<label>
						Especialidade <input id="med-esp" />
					</label>
				</div>
				<button class="btn btn-blue" onclick="salvarMedico()">Salvar</button>
				<button class="btn btn-gray" onclick="limparMedico()">Limpar</button>
			</div>
			<div class="table-box">
				<table>
					<thead>
						<tr>
							<th>#</th>
							<th>Nome</th>
							<th>CRM</th>
							<th>Especialidade</th>
							<th>Acoes</th>
						</tr>
					</thead>
					<tbody id="med-lista"></tbody>
				</table>
			</div>
		</div>

		<!-- PACIENTES -->
		<div id="page-pacientes" class="page">
			<h2>Pacientes</h2>
			<div class="form-box">
				<h3 id="titulo-pac">Cadastrar Paciente</h3>
				<input type="hidden" id="pac-id" />
				<div class="form-row">
					<label>
						Nome <input id="pac-nome" />
					</label>
					<label>
						CPF <input id="pac-cpf" maxlength="14" />
					</label>
					<label>
						Telefone <input id="pac-tel" maxlength="15" />
					</label>
				</div>
				<button class="btn btn-blue" onclick="salvarPaciente()">Salvar</button>
				<button class="btn btn-gray" onclick="limparPaciente()">Limpar</button>
			</div>
			<div class="table-box">
				<table>
					<thead>
						<tr>
							<th>#</th>
							<th>Nome</th>
							<th>CPF</th>
							<th>Telefone</th>
							<th>Acoes</th>
						</tr>
					</thead>
					<tbody id="pac-lista"></tbody>
				</table>
			</div>
		</div>

		<!-- CONSULTAS -->
		<div id="page-consultas" class="page">
			<h2>Agendar Consulta</h2>
			<div class="form-box">
				<div class="form-row">
					<label>
						Medico <select id="ag-med"></select>
					</label>
					<label>
						Paciente <select id="ag-pac"></select>
					</label>
					<label>
						Data e Hora <input type="datetime-local" id="ag-dt" />
					</label>
				</div>
				<button class="btn btn-blue" onclick="agendar()">Agendar</button>
			</div>
			<div class="table-box">
				<table>
					<thead>
						<tr>
							<th>Horario</th>
							<th>Medico</th>
							<th>Paciente</th>
							<th>Status</th>
							<th>Acao</th>
						</tr>
					</thead>
					<tbody id="cons-lista"></tbody>
				</table>
			</div>
		</div>

		<!-- AGENDA -->
		<div id="page-agenda" class="page">
			<h2>Agenda do Dia</h2>
			<div class="form-box">
				<div class="form-row">
					<label>
						Data <input type="date" id="filt-data" />
					</label>
					<label>
						Medico <select id="filt-med">
							<option value="">Todos</option>
						</select>
					</label>
					<button class="btn btn-blue" onclick="buscarAgenda()">Buscar</button>
				</div>
			</div>
			<div class="table-box">
				<table>
					<thead>
						<tr>
							<th>Horario</th>
							<th>Medico</th>
							<th>Paciente</th>
							<th>Status</th>
							<th>Acao</th>
						</tr>
					</thead>
					<tbody id="agenda-lista"></tbody>
				</table>
			</div>
		</div>

		<div id="msg"></div>

		<script>
			const API = 'http://localhost:5000/api';
			let medicos = [], pacientes = [];

			// --- MÁSCARAS AUTOMÁTICAS ---

			document.getElementById('pac-cpf').addEventListener('input', e => {
			let v = e.target.value.replace(/\D/g, "");
			v = v.replace(/(\d{3})(\d)/, "$1.$2");
			v = v.replace(/(\d{3})(\d)/, "$1.$2");
			v = v.replace(/(\d{3})(\d{1,2})$/, "$1-$2");
			e.target.value = v;
			});

			document.getElementById('pac-tel').addEventListener('input', e => {
			let v = e.target.value.replace(/\D/g, "");
			v = v.replace(/^(\d{2})(\d)/g, "($1) $2");
			v = v.replace(/(\d)(\d{4})$/, "$1-$2");
			e.target.value = v;
			});

			document.getElementById('med-crm').addEventListener('input', e => {
			let input = e.target;
			let rawValue = input.value.toUpperCase().replace(/CRM-/g, "").replace(/-/g, "").replace(/[^A-Z0-9]/g, "");
			if (rawValue.length === 0) { input.value = ""; return; }
			let formattedValue = "";
			if (rawValue.length <= 2) {
			formattedValue = "CRM-" + rawValue;
			} else {
			let uf = rawValue.substring(0, 2);
			let num = rawValue.substring(2);
			formattedValue = "CRM-" + uf + "-" + num;
			}
			if (input.value !== formattedValue) { input.value = formattedValue; }
			});

			// --- FUNÇÕES DE COMUNICAÇÃO ---

			async function req(metodo, rota, corpo) {
			const op = { method: metodo, headers: { 'Content-Type': 'application/json' } };
			if (corpo) op.body = JSON.stringify(corpo);
			const r = await fetch(API + rota, op);
			const d = await r.json().catch(() => ({}));
			return { ok: r.ok, d };
			}

			function ir(pagina, el) {
			document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
			document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
			document.getElementById('page-' + pagina).classList.add('active');
			el.classList.add('active');
			if (pagina === 'medicos') carregarMedicos();
			if (pagina === 'pacientes') carregarPacientes();
			if (pagina === 'consultas') abrirConsultas();
			if (pagina === 'agenda') abrirAgenda();
			}

			function msg(t, tipo) {
			const e = document.getElementById('msg');
			e.textContent = t; e.className = tipo; e.style.display = 'block';
			setTimeout(() => e.style.display = 'none', 3000);
			}

			// --- MEDICOS ---

			async function carregarMedicos() {
			const r = await req('GET', '/medicos');
			if (!r.ok) return;
			medicos = r.d;
			const tb = document.getElementById('med-lista');
			tb.innerHTML = medicos.map(m => `<tr>
				<td>${m.idMedico}</td>
				<td>${m.nome}</td>
				<td>${m.crm}</td>
				<td>${m.especialidade||'—'}</td>
				<td>
					<button class="btn btn-orange" onclick="editarMedico(${m.idMedico})">Editar</button>
					<button class="btn btn-red" onclick="excluirMedico(${m.idMedico})">Excluir</button>
				</td>
			</tr>`).join('');
			}

			function editarMedico(id) {
			const m = medicos.find(x => x.idMedico === id);
			if (!m) return;
			document.getElementById('med-id').value = m.idMedico;
			document.getElementById('med-nome').value = m.nome;
			document.getElementById('med-crm').value = m.crm;
			document.getElementById('med-esp').value = m.especialidade || '';
			document.getElementById('titulo-med').textContent = 'Editando: ' + m.nome;
			window.scrollTo(0, 0);
			}

			async function salvarMedico() {
			const id = document.getElementById('med-id').value;
			const corpo = { nome: document.getElementById('med-nome').value, crm: document.getElementById('med-crm').value, especialidade: document.getElementById('med-esp').value };
			const r = id ? await req('PUT', `/medicos/${id}`, corpo) : await req('POST', '/medicos', corpo);
			if (r.ok) { msg('Salvo!', 'ok'); limparMedico(); carregarMedicos(); }
			else msg(r.d.message || 'Erro ao salvar', 'err');
			}

			function limparMedico() {
			['med-id','med-nome','med-crm','med-esp'].forEach(i => document.getElementById(i).value = '');
			document.getElementById('titulo-med').textContent = 'Cadastrar Medico';
			}

			async function excluirMedico(id) {
			if (!confirm('Excluir este medico?')) return;
			const r = await req('DELETE', `/medicos/${id}`);
			if (r.ok) { msg('Excluido!', 'ok'); carregarMedicos(); }
			else msg(r.d.message || 'Erro', 'err');
			}

			// --- PACIENTES ---

			async function carregarPacientes() {
			const r = await req('GET', '/pacientes');
			if (!r.ok) return;
			pacientes = r.d;
			const tb = document.getElementById('pac-lista');
			tb.innerHTML = pacientes.map(p => `<tr>
				<td>${p.idPaciente}</td>
				<td>${p.nome}</td>
				<td>${p.cpf}</td>
				<td>${p.telefone||'—'}</td>
				<td>
					<button class="btn btn-orange" onclick="editarPaciente(${p.idPaciente})">Editar</button>
					<button class="btn btn-red" onclick="excluirPaciente(${p.idPaciente})">Excluir</button>
				</td>
			</tr>`).join('');
			}

			function editarPaciente(id) {
			const p = pacientes.find(x => x.idPaciente === id);
			if (!p) return;
			document.getElementById('pac-id').value = p.idPaciente;
			document.getElementById('pac-nome').value = p.nome;
			document.getElementById('pac-cpf').value = p.cpf;
			document.getElementById('pac-tel').value = p.telefone || '';
			document.getElementById('titulo-pac').textContent = 'Editando: ' + p.nome;
			window.scrollTo(0, 0);
			}

			async function salvarPaciente() {
			const id = document.getElementById('pac-id').value;
			const corpo = { nome: document.getElementById('pac-nome').value, cpf: document.getElementById('pac-cpf').value, telefone: document.getElementById('pac-tel').value };
			const r = id ? await req('PUT', `/pacientes/${id}`, corpo) : await req('POST', '/pacientes', corpo);
			if (r.ok) { msg('Salvo!', 'ok'); limparPaciente(); carregarPacientes(); }
			else msg(r.d.message || 'Erro ao salvar', 'err');
			}

			function limparPaciente() {
			['pac-id','pac-nome','pac-cpf','pac-tel'].forEach(i => document.getElementById(i).value = '');
			document.getElementById('titulo-pac').textContent = 'Cadastrar Paciente';
			}

			async function excluirPaciente(id) {
			if (!confirm('Excluir este paciente?')) return;
			const r = await req('DELETE', `/pacientes/${id}`);
			if (r.ok) { msg('Excluido!', 'ok'); carregarPacientes(); }
			else msg(r.d.message || 'Erro', 'err');
			}

			// --- CONSULTAS ---

			async function abrirConsultas() {
			const rm = await req('GET', '/medicos'); if(rm.ok) medicos = rm.d;
			const rp = await req('GET', '/pacientes'); if(rp.ok) pacientes = rp.d;
			document.getElementById('ag-med').innerHTML = medicos.map(m => `<option value="${m.idMedico}">${m.nome}</option>`).join('');
			document.getElementById('ag-pac').innerHTML = pacientes.map(p => `<option value="${p.idPaciente}">${p.nome}</option>`).join('');
			carregarConsultasHoje();
			}

			async function carregarConsultasHoje() {
			const hoje = new Date().toISOString().split('T')[0];
			const r = await req('GET', `/consultas/diaria?data=${hoje}`);
			const tb = document.getElementById('cons-lista');
			if(r.ok) tb.innerHTML = r.d.map(c => `<tr>
				<td>${new Date(c.dataHora).toLocaleTimeString()}</td>
				<td>${c.nomeMedico}</td>
				<td>${c.nomePaciente}</td>
				<td>
					<span class="status status-${c.status.toLowerCase()}">${c.status}</span>
				</td>
				<td>
					${c.status === 'Agendada' ? `<button class="btn btn-red" onclick="cancelarConsulta(${c.idConsulta})">Cancelar</button>` : '-'}
				</td>
			</tr>`).join('');
			}

			async function agendar() {
			const corpo = {
			idMedico: parseInt(document.getElementById('ag-med').value),
			idPaciente: parseInt(document.getElementById('ag-pac').value),
			dataHora: document.getElementById('ag-dt').value + ':00'
			};
			const r = await req('POST', '/consultas', corpo);
			if(r.ok) { msg('Agendado!', 'ok'); carregarConsultasHoje(); }
			else msg(r.d.message || 'Erro ao agendar', 'err');
			}

			// --- AGENDA ---

			async function abrirAgenda() {
			if (!medicos.length) { const rm = await req('GET', '/medicos'); if(rm.ok) medicos = rm.d; }
			document.getElementById('filt-data').value = new Date().toISOString().split('T')[0];
			document.getElementById('filt-med').innerHTML = '<option value="">Todos</option>' +
			medicos.map(m => `<option value="${m.idMedico}">${m.nome}</option>`).join('');
			buscarAgenda();
			}

			async function buscarAgenda() {
			const data = document.getElementById('filt-data').value;
			const med  = document.getElementById('filt-med').value;
			let rota = `/consultas/diaria?data=${data}`;
			if (med) rota += `&idMedico=${med}`;
			const r = await req('GET', rota);
			const tb = document.getElementById('agenda-lista');
			if(r.ok) tb.innerHTML = r.d.map(c => `<tr>
				<td>${new Date(c.dataHora).toLocaleTimeString()}</td>
				<td>${c.nomeMedico}</td>
				<td>${c.nomePaciente}</td>
				<td>
					<span class="status status-${c.status.toLowerCase()}">${c.status}</span>
				</td>
				<td>
					${c.status === 'Agendada' ? '<button class="btn btn-red" onclick="cancelarAgenda('+c.idConsulta+')">Cancelar</button>' : '-'}
				</td>
			</tr>`).join('');
			}

			async function cancelarAgenda(id) {
			if (!confirm('Cancelar esta consulta?')) return;
			const r = await req('PUT', `/consultas/${id}/cancelar`);
			if (r.ok) { msg('Consulta cancelada!', 'ok'); buscarAgenda(); }
			else msg(r.d.message || 'Erro ao cancelar', 'err');
			}

			async function cancelarConsulta(id) {
			if (!confirm('Cancelar esta consulta?')) return;
			const r = await req('PUT', `/consultas/${id}/cancelar`);
			if (r.ok) { msg('Consulta cancelada!', 'ok'); carregarConsultasHoje(); }
			else msg(r.d.message || 'Erro ao cancelar', 'err');
			}

			// Inicializa
			carregarMedicos();
		</script>
	</body>
</html>
